# ============================================================================
# dsh-gold-card —— DSH bundle patch（挂载声明）
# ============================================================================
# DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把「实时金价」面板插件插入 profile。
#
# 安装（任选其一）：
#   1) DSH 内置插件管理器 / Agent 工具：
#        plugin_manager install_bundle(target = link:<本目录绝对路径>)
#   2) CLI：
#        dsh plugin --profile desktop add link:<本目录绝对路径>
#
# 生效方式（实测）：
#   - Host 半边（路由 + index 注入监听）**即时生效**，不需要重启 DSH；
#   - 前端面板由 index 注入行加载，刷新一次页面（F5 / 重新打开窗口）即可看到侧边栏入口；
#   - 只有在应用启动时才会采集注入表的桌面壳上，若刷新后仍无入口，重启一次 DSH 即可。
#
# 可选配置（在 profile 的 cordis.patch.yml 里按 id 覆盖）：
#   - id: dsh-gold-card
#     config:
#       refreshMs: 900000    # 自动刷新间隔（毫秒，默认 15 分钟），同时下发给前端面板
# ============================================================================

- insert:
    - id: dsh-gold-card
      name: dsh-gold-card
